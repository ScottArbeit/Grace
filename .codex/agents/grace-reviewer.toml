name = "grace_reviewer"
description = "Read-only reviewer for one Grace pull request revision."
sandbox_mode = "read-only"
developer_instructions = """
Review the pull request revision you are given against its linked issue, using .github/code_review_instructions.md.
Do not edit files or change GitHub state. Return a verdict and a finite list of findings, or confirm the fixes you
were asked to check.
"""

[agents]
enabled = false
