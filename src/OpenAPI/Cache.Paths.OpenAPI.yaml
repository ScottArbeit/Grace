  /cache/artifact-grant-validation-key:
    get:
      tags:
        - Cache
      summary: Get the current Server process public key for local Cache grant validation.
      operationId: GetCacheArtifactGrantValidationKey
      security: []
      responses:
        '200':
          $ref: './Cache.Components.OpenAPI.yaml#/CacheArtifactGrantValidationKeyResponse'
        '400':
          $ref: './Responses.OpenAPI.yaml#/400'
        '500':
          $ref: './Responses.OpenAPI.yaml#/500'

  /cache/prepareDirectoryVersionZip:
    post:
      tags:
        - Cache
      summary: Prepare one Server-approved DirectoryVersion ZIP read and fill.
      operationId: PrepareDirectoryVersionZip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './Cache.Components.OpenAPI.yaml#/PrepareDirectoryVersionZipParameters'
      responses:
        '200':
          $ref: './Cache.Components.OpenAPI.yaml#/DirectoryVersionZipPreparationResponse'
        '400':
          $ref: './Responses.OpenAPI.yaml#/400'
        '403':
          $ref: './Responses.OpenAPI.yaml#/403'
        '500':
          $ref: './Responses.OpenAPI.yaml#/500'

  /cache/redeemDirectoryVersionZipFill:
    post:
      tags:
        - Cache
      summary: Redeem one permit and Cache process signature for a read-only ZIP source.
      operationId: RedeemDirectoryVersionZipFill
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './Cache.Components.OpenAPI.yaml#/RedeemDirectoryVersionZipFillParameters'
      responses:
        '200':
          $ref: './Cache.Components.OpenAPI.yaml#/DirectoryVersionZipFillSourceResponse'
        '400':
          $ref: './Responses.OpenAPI.yaml#/400'
        '403':
          $ref: './Responses.OpenAPI.yaml#/403'
        '500':
          $ref: './Responses.OpenAPI.yaml#/500'
