  /usage/storage:
    get:
      tags: [Usage]
      operationId: GetStorageUsage
      summary: Read the logical bytes Grace keeps for one repository, by content class.
      description: Requires OwnerAdmin on the given owner, including system-role inheritance. Supply all three IDs; names are not accepted. Permission is checked on the OwnerId before anything is read, so a caller without it gets the same 403 for a repository that exists and one that does not. The answer states its coverage; while it is partial, classes Grace does not count yet have no number and there is no total.
      parameters:
        - name: OwnerId
          in: query
          required: true
          schema: { type: string, format: uuid }
          description: Non-empty owner GUID.
        - name: OrganizationId
          in: query
          required: true
          schema: { type: string, format: uuid }
          description: Non-empty organization GUID.
        - name: RepositoryId
          in: query
          required: true
          schema: { type: string, format: uuid }
          description: Non-empty repository GUID. A deleted repository still answers until Grace reclaims its content.
      responses:
        '200':
          description: Retained logical bytes by content class, with coverage stated. Zero is a reading, not missing data.
          content:
            application/json:
              schema:
                $ref: './Usage.Components.OpenAPI.yaml#/RepositoryStorageUsageReturnValue'
        '400':
          $ref: './Responses.OpenAPI.yaml#/400'
        '401':
          description: Authentication required before any input is read.
        '403':
          description: The caller lacks OwnerAdmin on the owner. Says nothing about whether the repository exists.
        '404':
          description: The repository does not exist, or it belongs to a different owner or organization.
          content:
            application/json:
              schema:
                $ref: './Shared.Components.OpenAPI.yaml#/components/schemas/GraceError'
        '500':
          $ref: './Responses.OpenAPI.yaml#/500'
        '503':
          description: The storage meter could not be read. Retry the read.
          content:
            application/json:
              schema:
                $ref: './Shared.Components.OpenAPI.yaml#/components/schemas/GraceError'
