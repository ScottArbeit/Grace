    P256PublicJwk:
      type: object
      required: [Kty, Crv, X, Y]
      properties:
        Kty: { type: string, const: EC }
        Crv: { type: string, const: P-256 }
        X: { type: string }
        Y: { type: string }
    DirectoryVersionZipCacheArtifact:
      type: object
      required: [RepositoryId, DirectoryVersionId, Blake3Hash]
      properties:
        RepositoryId: { type: string, format: uuid }
        DirectoryVersionId: { type: string, format: uuid }
        Blake3Hash: { type: string, pattern: '^[0-9a-f]{64}$' }
    CacheArtifactGrantValidationKey:
      type: object
      required: [Issuer, Audience, Algorithm, KeyId, PublicJwk]
      properties:
        Issuer: { type: string, const: Grace.Server.CacheArtifactGrant.v1 }
        Audience: { type: string, const: Grace.Cache.Artifact.v1 }
        Algorithm: { type: string, const: ES256 }
        KeyId: { type: string }
        PublicJwk: { $ref: '#/P256PublicJwk' }
    CacheArtifactGrantValidationKeyReturnValue:
      description: Grace response envelope containing the current Server process validation key.
      allOf:
        - $ref: 'Shared.Components.OpenAPI.yaml#/components/schemas/GraceReturnValue'
        - type: object
          required: [ReturnValue]
          properties:
            ReturnValue: { $ref: '#/CacheArtifactGrantValidationKey' }
    PrepareDirectoryVersionZipParameters:
      allOf:
        - $ref: 'Shared.Components.OpenAPI.yaml#/components/schemas/CommonParameters'
        - type: object
          required: [RepositoryId, DirectoryVersionId, CachePublicKey]
          properties:
            RepositoryId: { type: string, format: uuid }
            DirectoryVersionId: { type: string, format: uuid }
            CachePublicKey: { $ref: '#/P256PublicJwk' }
    RedeemDirectoryVersionZipFillParameters:
      allOf:
        - $ref: 'Shared.Components.OpenAPI.yaml#/components/schemas/CommonParameters'
        - type: object
          required: [Permit, Signature]
          properties:
            Permit: { type: string }
            Signature: { type: string }
    DirectoryVersionZipPreparation:
      type: object
      required: [Artifact, ArtifactGrant, ArtifactGrantExpiresAt, Permit, PermitExpiresAt, RedemptionBytes]
      properties:
        Artifact: { $ref: '#/DirectoryVersionZipCacheArtifact' }
        ArtifactGrant: { type: string }
        ArtifactGrantExpiresAt: { type: string, format: date-time }
        Permit: { type: string }
        PermitExpiresAt: { type: string, format: date-time }
        RedemptionBytes: { type: string }
    DirectoryVersionZipFillSource:
      type: object
      required: [Artifact, SourceUri, SourceExpiresAt]
      properties:
        Artifact: { $ref: '#/DirectoryVersionZipCacheArtifact' }
        SourceUri: { type: string, format: uri }
        SourceExpiresAt: { type: string, format: date-time }
    DirectoryVersionZipPreparationResponse:
      description: Exact immutable artifact with a five-minute read grant and separate fill permit.
      content:
        application/json:
          schema: { $ref: '#/DirectoryVersionZipPreparation' }
    DirectoryVersionZipFillSourceResponse:
      description: Exact artifact and fresh read-only Blob source.
      content:
        application/json:
          schema: { $ref: '#/DirectoryVersionZipFillSource' }
    CacheArtifactGrantValidationKeyResponse:
      description: Current Server process public key and fixed Cache grant validation contract.
      content:
        application/json:
          schema: { $ref: '#/CacheArtifactGrantValidationKeyReturnValue' }
