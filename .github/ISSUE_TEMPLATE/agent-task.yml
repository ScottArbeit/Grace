name: Agent Task
description: Deliver one bounded Grace outcome through a Factory V2 run.
title: ""
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Use one issue for one user-visible outcome and one primary invariant family. Remove unrelated prompts rather
        than filling them with speculative N/A answers. Stateful, destructive, filesystem, retry, recovery,
        concurrency, background, or multi-authority work requires an algorithm-witness result before coding.

  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What can one supported user or system actor observe when this issue is complete?
      placeholder: |
        User-visible outcome:
        Why this matters for Grace:
        Stable public or behavioral proof seam:
    validations:
      required: true

  - type: textarea
    id: supported-world
    attributes:
      label: Supported world and quality contract
      description: Define the exact world Product V1 must support for this issue.
      placeholder: |
        - Baseline quality contract and overrides:
        - Supported actor or client:
        - Environment and topology:
        - Supported producer paths:
        - Valuable data or irreversible effects:
        - Retry, restart, and recovery promise:
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope, capability budget, and explicit non-goals
      description: Keep one outcome, one primary invariant, and at most one new durable partial-state lifecycle.
      placeholder: |
        Required now:
        - ...

        Deferred, rejected, or out of scope:
        - ...

        Capability-budget result:
        - New durable partial-state lifecycles: 0 or 1
        - Pre-tracer enabling PR count after this issue: 0, 1, or 2
        - Optional automation deliberately excluded:
    validations:
      required: true

  - type: textarea
    id: invariant
    attributes:
      label: Primary invariant and authority
      description: State the one invariant family this issue owns and what source is authoritative.
      placeholder: |
        - Primary invariant:
        - Authoritative source at the decision point:
        - Identity dimensions:
        - Commit point, when relevant:
        - Observable success and failure states:
    validations:
      required: true

  - type: textarea
    id: algorithm-readiness
    attributes:
      label: Algorithm readiness
      description: Link the executable witness and verdict, or explain precisely why the gate does not apply.
      placeholder: |
        - Required: yes or no
        - Witness location and run command, or N/A rationale:
        - Verdict: proven, simplified, or blocked
        - Effect order and commit point propagated into this issue:
        - Failure residue, restart, retry, cleanup, cancellation, and concurrency rules:
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance sequence and required failures
      description: Include only failures produced by the supported world or intrinsic to selected capabilities.
      placeholder: |
        Acceptance sequence:
        1. ...
        2. ...
        3. ...

        Required failure behavior:
        | Supported producer or failure | Expected result | Proof |
        | --- | --- | --- |
        | ... | ... | ... |
    validations:
      required: true

  - type: textarea
    id: propagation-paths
    attributes:
      label: Contract propagation and paths
      description: Name only surfaces the slice actually changes or must prove unchanged.
      placeholder: |
        Updated public, durable, generated, or documentation surfaces:
        - ...

        Unchanged or N/A surfaces and reason:
        - ...

        Owned paths:
        - ...

        Sensitive or forbidden paths:
        - ...
    validations:
      required: true

  - type: dropdown
    id: validation-profile
    attributes:
      label: Validation profile
      description: Select the narrowest applicable profile from docs/Development process.md.
      options:
        - docs-only
        - domain-contract
        - cli-command
        - server-api
        - actor-workflow
        - sdk-client
        - deployment-runtime
    validations:
      required: true

  - type: textarea
    id: proof
    attributes:
      label: Proof and validation
      placeholder: |
        - Focused failing proof or prior regression evidence:
        - Positive, negative, and boundary proof:
        - Failure-injection, restart, replay, or concurrency proof when included:
        - Formatting, generated-artifact, freshness, or syntax checks:
        - Required GitHub Validate expectation:
        - Manual or runtime proof:
    validations:
      required: true

  - type: textarea
    id: stop-done
    attributes:
      label: Owner stop conditions and definition of done
      placeholder: |
        Stop and return to the owner if:
        - a second primary invariant, durable state machine, or authority boundary is needed
        - a new product semantic or public contract is needed
        - supported topology or owned paths must expand materially
        - the algorithm witness is contradicted
        - a third enabling PR would precede the tracer

        Done when:
        - the acceptance sequence works through the stable boundary
        - focused proof and final-head GitHub Validate pass
        - explicit non-goals remain absent
        - R1 discovery review is complete
        - accepted ledger items, if any, are repaired and R2 closure-reviewed
        - residual risk and skipped proof are recorded
    validations:
      required: true
